<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Classical Dance Tutor — Bharatanatyam</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script type="module" src="https://unpkg.com/three@0.158.0/build/three.module.js"></script>
    <script type="module" src="https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js"></script>
    <script type="module" src="https://unpkg.com/three@0.158.0/examples/jsm/loaders/GLTFLoader.js"></script>
  </head>
  <body>
    <div id="app" class="app-grid">
      <header class="topbar">
        <div class="brand">
          <h1>Learn Classical — Bharatanatyam</h1>
          <p class="tag">Interactive theory & 3D practicals</p>
        </div>
        <div class="actions">
          <button id="open-dashboard">Dashboard</button>
        </div>
      </header>

      <aside class="sidebar card">
        <h2>Lessons</h2>
        <div id="tiers" class="lesson-list"></div>
      </aside>

      <section class="stage card" id="viewer">
        <div class="stage-header">
          <h2 id="lesson-title">Interactive 3D Visualizer</h2>
          <div class="stage-controls">
            <button id="preset-front">Front</button>
            <button id="preset-side">Side</button>
            <button id="preset-top">Top</button>
          </div>
        </div>

        <div id="three-root" class="three-root"></div>

        <div class="viewer-toolbar">
          <input id="model-url" placeholder="/uploads/sample_dancer.glb" />
          <button id="load-model">Load Model</button>
          <select id="anim-select"><option value="">— Animation —</option></select>
          <button id="play-anim">Play</button>
          <button id="pause-anim">Pause</button>
          <label>Speed <input id="speed" type="range" min="0.25" max="2" step="0.05" value="1"/></label>
          <label class="toggle"><input type="checkbox" id="wireframe"/> Wireframe</label>
          <label class="toggle"><input type="checkbox" id="skeleton"/> Skeleton</label>
        </div>
      </section>

      <section class="notes card" id="notes">
        <h2>Lesson Notes</h2>
        <div id="lesson-notes">Select a lesson to see theory and practice steps.</div>
        <div class="controls-row">
          <button id="practice">Mark Lesson Practiced</button>
          <button id="achievement">Unlock Achievement</button>
        </div>
        <h3>Progress</h3>
        <pre id="progress-json">{} </pre>
      </section>

      <footer class="footer">Powered by 3D · Practice with slow-motion & bone-views</footer>

    </div>

    <script type="module" src="/static/app.js"></script>
  </body>
  </html>
